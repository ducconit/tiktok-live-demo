# Air — hot reload cho Go (chuẩn air-verse/air)
# Chạy qua docker compose (env inject sẵn), nên không cần env_files.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -tags sonic -o ./tmp/main ./cmd/app"
  bin = "./tmp/main"
  include_ext = ["go"]
  exclude_dir = ["tmp", "db", "migrations", "testutil"]
  exclude_regex = ["_test.go"]
  delay = 500
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
