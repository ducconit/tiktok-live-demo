name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: backend
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -race
      - name: Coverage
        run: go test ./... -coverprofile=coverage.out && go tool cover -func=coverage.out | grep -E "total:"

  dashboard:
    name: Dashboard (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install (root workspaces)
        run: bun install --frozen-lockfile
        working-directory: .
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build

  frontend:
    name: Frontend (typecheck + build + unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install (root workspaces)
        run: bun install --frozen-lockfile
        working-directory: .
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Unit tests
        run: bun run test

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        run: |
          # Runner image mới không kèm compose plugin — cài nhanh rồi validate
          mkdir -p ~/.docker/cli-plugins
          curl -sSL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 \
            -o ~/.docker/cli-plugins/docker-compose
          chmod +x ~/.docker/cli-plugins/docker-compose
          docker compose config >/dev/null
